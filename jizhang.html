<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>记账本 · 随手记风格</title>
<link rel="icon" type="image/svg+xml" href="icon-jz.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-jz.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="记账本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --brand:#FF7A45; --brand-d:#F2641E;
  --exp:#FF5B5B; --inc:#2BBF7E;
  --bg:#F4F5F7; --card:#FFFFFF;
  --ink:#1F2233; --ink-2:#6B7080; --ink-3:#A8ADB8;
  --line:#EEF0F3; --shadow:0 2px 14px rgba(20,23,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#E6E8EC;color:var(--ink)}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;
  display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.08);overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;position:relative;background:var(--bg);min-height:100vh}
.sidebar{display:none}
.topbar{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:14px 16px 18px}
.topbar .row{display:flex;align-items:center;justify-content:space-between}
.topbar .book{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;cursor:pointer}
.topbar .book .arrow{font-size:11px;opacity:.85}
.topbar .menu{font-size:20px;opacity:.9}
.balance{text-align:center;margin-top:14px}
.balance .lbl{font-size:12px;opacity:.85}
.balance .num{font-size:34px;font-weight:800;letter-spacing:.5px;margin-top:2px}
.balance .sub{display:flex;justify-content:center;gap:22px;margin-top:10px;font-size:13px}
.balance .sub b{font-weight:700}
.balance .sub .e{color:#fff}
.balance .sub .i{color:#fff}
.view{flex:1;overflow-y:auto;padding-bottom:70px;background:var(--bg)}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin:12px}
.sec-t{font-size:13px;color:var(--ink-2);padding:12px 14px 4px;font-weight:600}
.quick{display:flex;gap:10px;padding:4px 12px 14px}
.quick .q{flex:1;background:var(--card);border-radius:12px;box-shadow:var(--shadow);
  padding:12px;text-align:center;cursor:pointer}
.quick .q .ic{font-size:22px}
.quick .q .t{font-size:12px;color:var(--ink-2);margin-top:4px}
.record{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.record:last-child{border-bottom:none}
.record .ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;background:#F3F4F7}
.record .mid{flex:1;min-width:0}
.record .mid .n{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.record .mid .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.record .amt{font-size:16px;font-weight:700}
.record .amt.exp{color:var(--exp)}
.record .amt.inc{color:var(--inc)}
.day-h{display:flex;justify-content:space-between;padding:10px 14px 4px;font-size:13px;color:var(--ink-2);font-weight:600}
.day-h .r{color:var(--ink-3);font-weight:500}
.day-sub{display:flex;justify-content:space-between;padding:8px 12px 3px;font-size:12px;color:var(--ink-3);font-weight:500}
.day-sub .r{color:var(--ink-3);font-weight:400}
.empty{padding:40px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.fab{position:absolute;right:16px;bottom:82px;
  background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;border:none;
  height:38px;padding:0 15px 0 11px;border-radius:19px;font-size:13px;font-weight:600;box-shadow:0 3px 12px rgba(242,100,30,.34);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;line-height:1;
  transition:transform .15s,box-shadow .15s}
.fab:active{transform:scale(.94);box-shadow:0 1px 6px rgba(242,100,30,.3)}
.fab .plus{font-size:17px;font-weight:400;line-height:1}
.bottom{position:absolute;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
  display:flex;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(0,0,0,.04)}
.bottom .tab{flex:1;text-align:center;padding:8px 0 9px;font-size:11px;color:var(--ink-3);cursor:pointer}
.bottom .tab .ic{font-size:20px;display:block;margin-bottom:1px}
.bottom .tab.active{color:var(--brand);font-weight:600}
/* sheet */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.mask.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;
  border-radius:18px 18px 0 0;transform:translateY(100%);transition:.28s;z-index:21;max-height:92%;overflow-y:auto}
.sheet.show{transform:translateY(0)}
.sheet .sh-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.seg{display:flex;background:#F0F1F4;border-radius:20px;padding:3px}
.seg button{border:none;background:none;padding:6px 18px;border-radius:18px;font-size:14px;color:var(--ink-2);cursor:pointer;font-weight:600}
.seg button.on.exp{background:var(--exp);color:#fff}
.seg button.on.inc{background:var(--inc);color:#fff}
.sheet .close{font-size:22px;color:var(--ink-3);cursor:pointer}
.amt-box{padding:18px 16px 6px;text-align:right}
.amt-box .a{font-size:40px;font-weight:800;color:var(--ink);min-height:46px}
.amt-box .a .cur{font-size:26px;color:var(--ink-3);margin-right:4px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.kp button{border:none;background:#fff;padding:18px 0;font-size:22px;color:var(--ink);cursor:pointer}
.kp button:active{background:#F6F7F9}
.kp .del{color:var(--brand);font-size:20px}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 14px}
.cats .c{text-align:center;cursor:pointer;padding:6px 2px;border-radius:10px}
.cats .c .ic{font-size:24px}
.cats .c .t{font-size:11px;color:var(--ink-2);margin-top:3px}
.cats .c.on{background:#FFF1EA}
.cats .c.on .t{color:var(--brand);font-weight:600}
.meta-row{display:flex;gap:8px;padding:6px 14px 14px}
.meta-row .m{flex:1;background:#F6F7F9;border-radius:10px;padding:9px 10px;font-size:13px;color:var(--ink-2);position:relative}
.meta-row .m input,.meta-row .m select{border:none;background:none;outline:none;width:100%;font-size:13px;color:var(--ink);margin-top:2px;font-family:inherit}
.meta-row .m input::placeholder{color:var(--ink-3)}
.save-btn{width:calc(100% - 28px);margin:0 14px 18px;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.save-btn:disabled{opacity:.5}
/* report */
.donut-wrap{display:flex;align-items:center;gap:14px;padding:6px 14px 14px;flex-wrap:wrap}
.legend{flex:1;min-width:140px}
.legend .lg{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0;color:var(--ink-2)}
.legend .lg .dot{width:10px;height:10px;border-radius:3px}
.legend .lg .pc{margin-left:auto;color:var(--ink-3)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 14px 0;justify-content:center}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .col .stk{display:flex;flex-direction:column;justify-content:flex-end;width:22px}
.bars .col .b{width:22px;border-radius:3px 3px 0 0}
.bars .col .b.exp{background:var(--exp)}
.bars .col .b.inc{background:var(--inc)}
.bars .col .lab{font-size:10px;color:var(--ink-3);margin-top:6px}
.budget-row{padding:8px 14px}
.budget-row .bt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.budget-row .bt .used{color:var(--exp);font-weight:600}
.bar-bg{height:10px;background:#F0F1F4;border-radius:6px;overflow:hidden}
.bar-fg{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-d));border-radius:6px}
/* mine */
.mine-sec{margin:12px}
.mine-sec .t{font-size:13px;color:var(--ink-2);padding:0 2px 8px;font-weight:600}
.list{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.list .it{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:none}
.list .it .ic{font-size:20px}
.list .it .nm{flex:1;font-size:15px}
.list .it .ar{color:var(--ink-3);font-size:14px}
.list .it .act{color:var(--brand);font-size:13px;margin-left:8px}
.btn{display:block;width:calc(100% - 24px);margin:10px 12px;padding:13px;border:1px solid var(--line);border-radius:12px;
  background:#fff;color:var(--ink);font-size:14px;cursor:pointer;text-align:center;font-family:inherit}
.btn.danger{color:var(--exp);border-color:#FCD5D5}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;border:none;font-weight:600}
.about{text-align:center;color:var(--ink-3);font-size:12px;padding:16px}
/* 负债台账 */
.ditem{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.ditem:last-child{border-bottom:none}
.ditem .dic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;background:#F3F4F7;flex-shrink:0}
.ditem .dmid{flex:1;min-width:0}
.ditem .dmid .dn{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem .dmid .ds{font-size:11px;color:var(--ink-3);margin-top:3px}
.ditem .dbar{height:5px;background:#F0F1F4;border-radius:3px;margin-top:5px;overflow:hidden}
.ditem .dbar>i{display:block;height:100%;background:linear-gradient(90deg,#FF7A45,#E06FD9);border-radius:3px}
.ditem .damt{font-size:16px;font-weight:700;color:var(--exp);white-space:nowrap}
.ditem:active{background:#FAFAFB}
/* 心愿清单 */
.wcards{padding:4px 12px}
.wcard{display:flex;gap:11px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;margin:10px 0;cursor:pointer}
.wcard.bought{opacity:.6}
.wcard.bought .wt{text-decoration:line-through}
.wthumb{width:74px;height:74px;border-radius:10px;background:#F3F4F7;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-3)}
.wthumb img{width:100%;height:100%;object-fit:cover;display:block}
.winfo{flex:1;min-width:0;display:flex;flex-direction:column}
.winfo .wt{font-size:15px;font-weight:600;line-height:1.35;word-break:break-all}
.winfo .wp{font-size:13px;color:var(--ink-2);margin-top:5px;font-weight:600}
.winfo .wp .wl{color:var(--brand);font-weight:500;text-decoration:none}
.wacts{display:flex;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.wacts .wb{border:none;background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer;font-family:inherit}
.wacts .wb.on{background:var(--inc)}
.wacts .wb.ghost{background:#F3F4F7;color:var(--ink-2)}
.wacts .wb.danger{background:#FCD5D5;color:var(--exp)}
/* 心愿编辑弹窗的图片区 */
.popimg{margin-bottom:10px}
.pimp{width:100%;height:130px;border:1px dashed #D8DCE3;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#FAFBFC}
.pimp img{width:100%;height:100%;object-fit:contain;display:block}
.pimp .ph{color:var(--ink-3);font-size:13px}
/* 首页心愿横幅入口 */
.wban{display:flex;align-items:center;gap:12px;margin:12px;padding:15px 16px;border-radius:14px;
  background:linear-gradient(135deg,#FF7A45,#F2641E);color:#fff;cursor:pointer;box-shadow:0 4px 16px rgba(242,100,30,.3)}
.wban:active{transform:scale(.99)}
.wban .wl{flex:1;min-width:0}
.wban .wl1{font-size:17px;font-weight:700;letter-spacing:.5px}
.wban .wl2{font-size:12px;opacity:.92;margin-top:5px;line-height:1.5}
.wban .wl2 b{font-weight:700;font-size:13px}
.wban .wr{display:flex;align-items:center;gap:8px;flex-shrink:0}
.wban .wthumbs{display:flex}
.wban .wthumbs img,.wban .wthumbs .ph,.wban .wthumbs .more{width:34px;height:34px;border-radius:8px;margin-left:-9px;border:2px solid #F2641E;object-fit:cover;background:#fff}
.wban .wthumbs>*:first-child{margin-left:0}
.wban .wthumbs .ph{display:flex;align-items:center;justify-content:center;color:#F2641E;font-size:14px;font-weight:700}
.wban .wthumbs .more{display:flex;align-items:center;justify-content:center;background:#FFB896;color:#fff;font-size:11px;font-weight:700}
.wban .wgo{font-size:22px;opacity:.9}
/* 工具箱页 */
.toolgrid{padding:12px}
.tcard{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px;cursor:pointer}
.tcard:active{background:#FAFAFB}
.tcard .tc1{display:flex;align-items:center;gap:8px}
.tcard .tci{font-size:20px}
.tcard .tct{font-size:15px;font-weight:600;flex:1}
.tcard .tcar{color:var(--ink-3);font-size:20px}
.tcard .tc2{font-size:26px;font-weight:800;color:var(--exp);margin-top:10px;letter-spacing:.5px}
.tcard.wish .tc2{font-size:17px;color:var(--ink);font-weight:600;line-height:1.4}
.tcard .tc3{font-size:12px;color:var(--ink-3);margin-top:6px}
.tcthumbs{display:flex;margin-top:11px;min-height:34px;align-items:center}
.tcthumbs img,.tcthumbs .ph,.tcthumbs .more{width:34px;height:34px;border-radius:8px;margin-right:-8px;object-fit:cover;background:#F3F4F7;border:2px solid #fff}
.tcthumbs .ph{display:flex;align-items:center;justify-content:center;color:var(--brand);font-size:14px;font-weight:700}
.wthumbs .ph,.tcthumbs .ph{white-space:normal;line-height:1.15;padding:2px;font-size:9px;font-weight:700;text-align:center;word-break:break-all}
.tcthumbs .more{display:flex;align-items:center;justify-content:center;background:var(--brand);color:#fff;font-size:11px;font-weight:700}
.tcthumbs .tcmt{color:var(--ink-3);font-size:12px;margin-right:0}
.backbar{padding:10px 14px 0}
.backbar .bk{color:var(--brand);font-size:14px;font-weight:600;cursor:pointer}
.pop{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30}
.pop.show{display:flex}
.pop .box{background:#fff;border-radius:14px;width:82%;max-width:340px;padding:18px}
.pop .box h3{margin:0 0 12px;font-size:16px}
.pop .box input,.pop .box select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px;margin-bottom:10px;font-family:inherit}
.pop .box .row{display:flex;gap:10px;margin-top:6px}
.pop .box .row button{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit}
.pop .box .row .ok{background:var(--brand);color:#fff;font-weight:600}
.pop .box .row .no{background:#F0F1F4;color:var(--ink-2)}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;
  padding:10px 18px;border-radius:10px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}
@media (max-width:480px){.app{box-shadow:none}}

/* ===== PC 端适配（≥880px）：左侧导航栏 + 自适应宽内容区 ===== */
@media (min-width:880px){
  body{background:#EDF0F4}
  .app{flex-direction:row;max-width:1200px;min-height:100vh;box-shadow:0 0 50px rgba(20,23,40,.10);overflow:visible;background:#fff}
  .sidebar{display:flex;flex-direction:column;width:236px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:relative;z-index:5}
  .main{flex:1;display:flex;flex-direction:column;background:var(--bg);min-height:100vh;position:relative}
  .bottom{display:none}
  .topbar{border-radius:0;padding:22px 28px 26px}
  .balance .num{font-size:40px}
  .fab{right:32px;bottom:32px;padding:0 18px 0 13px;height:42px;font-size:14px}
  .view{padding-bottom:34px}
  .card,.quick,.sec-t{padding-left:28px;padding-right:28px;margin-left:18px;margin-right:18px}
  .quick,.sec-t{padding-left:18px;padding-right:18px}
  .donut-wrap,.bars,.budget-row{padding-left:28px;padding-right:28px}
  .record{padding-left:28px;padding-right:28px}
  .day-h{padding-left:28px;padding-right:28px}
  .mine-sec{margin:14px 18px}
  .mask{position:fixed}
  .pop{position:fixed}
  .toast{position:fixed}
  .sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(100%);max-width:540px}
  .sheet.show{transform:translateX(-50%) translateY(0)}
  .about{padding:24px}
}
.sidebar .brand{font-size:18px;font-weight:800;color:var(--brand);padding:4px 10px 20px;display:flex;align-items:center;gap:7px}
.sidebar .nav-item{display:flex;align-items:center;gap:11px;padding:12px 12px;border-radius:11px;color:var(--ink-2);cursor:pointer;font-size:15px;margin-bottom:5px;transition:background .15s}
.sidebar .nav-item .ic{font-size:19px;width:22px;text-align:center}
.sidebar .nav-item:hover{background:#F6F7F9}
.sidebar .nav-item.active{background:#FFF1EA;color:var(--brand);font-weight:600}
  .sidebar .side-fab{margin-top:20px;background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;text-align:center;padding:13px;border-radius:12px;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(242,100,30,.28)}
  .sidebar .side-fab:active{transform:scale(.98)}
.sidebar .side-tip{margin-top:auto;font-size:11px;color:var(--ink-3);line-height:1.6;padding:10px 10px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main" id="main">
    <div class="topbar" id="topbar"></div>
    <div class="view" id="view"></div>
    <button class="fab" id="fab"><span class="plus">+</span>记一笔</button>
  </div>
  <div class="bottom" id="bottom"></div>

  <div class="mask" id="mask"></div>
  <div class="sheet" id="sheet"></div>

  <div class="pop" id="pop"><div class="box" id="popBox"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script>
(function(){
  // ---------- 常量与预设 ----------
  const KEY='suishouji_clone_v1';
  const PALETTE=['#FF7A45','#FF5B5B','#2BBF7E','#5B8DEF','#A86BFF','#FFB020','#27C2C2','#FF8FB3','#7C8AA5','#E06FD9','#6CC24A','#FF924C'];

  const DEF_CATS={
    exp:[
      {id:'food',name:'餐饮',icon:'🍚',color:'#FF7A45'},
      {id:'trans',name:'交通',icon:'🚇',color:'#5B8DEF'},
      {id:'shop',name:'购物',icon:'🛒',color:'#FF5B5B'},
      {id:'home',name:'居住',icon:'🏠',color:'#A86BFF'},
      {id:'medical',name:'医疗',icon:'💊',color:'#27C2C2'},
      {id:'social',name:'人情',icon:'🎁',color:'#FF8FB3'},
      {id:'repay',name:'还款',icon:'💰',color:'#E06FD9'},
      {id:'fun',name:'娱乐',icon:'🎮',color:'#FFB020'},
      {id:'comm',name:'通讯',icon:'📱',color:'#6CC24A'},
      {id:'study',name:'学习',icon:'📚',color:'#5B8DEF'},
      {id:'pet',name:'宠物',icon:'🐱',color:'#FF924C'},
      {id:'other_e',name:'其他',icon:'💡',color:'#7C8AA5'}
    ],
    inc:[

    {id:'cash',name:'现金',icon:'💵'},

  const DEBT_VERSION=2;

    {id:'debt_mortgage',name:'房贷',icon:'🏠',total:10000},

  const DEF_DEBTS_V1={debt_ccb:1000,debt_mortgage:10000,debt_cmb:50000,debt_zhaolian:50000,debt_jiebei:3000,debt_fenfu:600,debt_property:3000,debt_zhangyi:23000,debt_panjie:10800};
  // 仅当本地负债仍为旧预设原样时自动升级，避免覆盖你手动改过的数据
  function upgradeDebts(list){
    if(!Array.isArray(list)||!list.length)return JSON.parse(JSON.stringify(DEF_DEBTS));
    if(list.length!==Object.keys(DEF_DEBTS_V1).length)return list;
    const allV1=Object.keys(DEF_DEBTS_V1).every(id=>{
      const d=list.find(x=>x.id===id);
      return d&&Math.abs((Number(d.total)||0)-DEF_DEBTS_V1[id])<0.005;
    });
    return allV1?JSON.parse(JSON.stringify(DEF_DEBTS)):list;
  }

  // ---------- 工具函数 ----------
  function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
  function ymStr(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function fmt(n){const v=Math.round((Number(n)||0)*100)/100;return v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function fmtS(n){const v=Math.round((Number(n)||0)*100)/100;return v.toLocaleString('zh-CN',{maximumFractionDigits:2});}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

  function monthRecords(recs,ym){
    return recs.filter(r=>r.date&&r.date.slice(0,7)===ym);

  function sumBy(recs,type){return recs.filter(r=>r.type===type).reduce((s,r)=>s+r.amount,0);}

  // ---------- 默认数据 ----------

  // 补全缺失字段：本地老数据、云端旧数据、导入的备份都可能缺字段
  function normalizeState(o){
    if(!o||typeof o!=='object')return defaultState();
    if(!o.cats)o.cats=JSON.parse(JSON.stringify(DEF_CATS));
    else{
      if(!Array.isArray(o.cats.exp))o.cats.exp=JSON.parse(JSON.stringify(DEF_CATS.exp));
      if(!Array.isArray(o.cats.inc))o.cats.inc=JSON.parse(JSON.stringify(DEF_CATS.inc));
    }
    if(!Array.isArray(o.accounts)||!o.accounts.length)o.accounts=JSON.parse(JSON.stringify(DEF_ACCOUNTS));
    if(!Array.isArray(o.books)||!o.books.length)o.books=[{id:'daily',name:'日常账本',icon:'📒'}];
    if(!Array.isArray(o.records))o.records=[];
    else{
      o.records.forEach(r=>{
        if(!r.date){
          if(r.ts && typeof r.ts==='number') r.date=new Date(r.ts).toISOString().slice(0,10);
          else r.date=todayStr();
        }
      });
    }
    if(!o.budget)o.budget={total:3000};
    o.debts=upgradeDebts(o.debts);
    o.debtVersion=DEBT_VERSION;
    if(!Array.isArray(o.wishes))o.wishes=[];
    return o;
  }

      }

  // 报表
  function renderReport(){
    const ym=ymStr(new Date());

    // 近6月柱状
    const bars=renderBars(recs);

    const budgetHtml=`<div class="card budget-row">

    </div>`;
    return `

      <div class="sec-t">近 6 个月收支</div>
      <div class="card">${bars}</div>
      ${budgetHtml}`;
  }
  function renderDonut(segs,total){
    const cx=80,cy=80,r=62,sw=26;
    let a=-Math.PI/2,paths='';
    if(total<=0){
      paths=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EEF0F3" stroke-width="${sw}"/>`;
    }else{
      segs.forEach(s=>{
        const ang=s.value/total*Math.PI*2;
        if(ang>=Math.PI*2-0.001){paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}"/>`;return;}
        const a1=a+ang;
        const x0=cx+r*Math.cos(a),y0=cy+r*Math.sin(a);
        const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
        const large=ang>Math.PI?1:0;
        paths+=`<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${s.color}"/>`;
        a=a1;
      });
    }
    const hole=`<circle cx="${cx}" cy="${cy}" r="${r-sw/2}" fill="#fff"/>`;
    const txt=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="12" fill="#6B7080">支出</text>
      <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="16" font-weight="700" fill="#FF5B5B">¥${fmtS(total)}</text>`;
    return `<svg width="160" height="160" viewBox="0 0 160 160">${paths}${hole}${txt}</svg>`;
  }
  function renderBars(recs){
    const now=new Date();const arr=[];
    for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const ym=ymStr(d);
      const mr=monthRecords(recs,ym);arr.push({ym,exp:sumBy(mr,'exp'),inc:sumBy(mr,'inc')});}

  // 压缩图片：等比缩到 480px 内，JPEG 0.65，控制体积
  function compressImage(file,cb){
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        const scale=Math.min(1,IMG_MAX/Math.max(w,h));
        w=Math.round(w*scale);h=Math.round(h*scale);
        const cv=document.createElement('canvas');
        cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        try{cb(cv.toDataURL('image/jpeg',IMG_Q));}
        catch(err){toast('图片处理失败');}
      };
      img.onerror=()=>toast('图片读取失败');
      img.src=fr.result;
    };
    fr.onerror=()=>toast('图片读取失败');
    fr.readAsDataURL(file);
  }

  function initCloud(){
    try{
      if(typeof WorkBuddyCloud==='undefined'){cloudReady=false;return false;}
      cloud=WorkBuddyCloud.createWorkBuddyCloud({endpoint:CLOUD_CFG.endpoint,publishableKey:CLOUD_CFG.publishableKey});
      cloudReady=true;return true;
    }catch(e){cloudReady=false;return false;}
  }
  async function cloudPush(){
    if(syncing||!cloudReady)return;
    syncing=true;updateCloudBadge('同步中…');
    try{
      let ts=null;
      try{
        // 优先用云端返回的 updated_at 做时间戳，避免两端本机时钟不一致导致永远拉不到对方数据
        const {data,error}=await cloud.database.from(CLOUD_TABLE).upsert({id:'main',state:state,updated_at:new Date().toISOString()}).select();
        if(error)throw error;
        ts=(data&&data[0]&&data[0].updated_at)?new Date(data[0].updated_at).getTime():Date.now();
      }catch(e2){
        // 兼容不支持 .select() 的情况，回退普通 upsert
        const {error}=await cloud.database.from(CLOUD_TABLE).upsert({id:'main',state:state,updated_at:new Date().toISOString()});
        if(error)throw error;
        ts=Date.now();
      }
      localStorage.setItem(CLOUD_TS_KEY,String(ts));
      updateCloudBadge('已同步 '+new Date(ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
    }catch(e){updateCloudBadge('同步失败，仅本机保存');}
    syncing=false;
  }
  function lastSyncText(){
    const ts=Number(localStorage.getItem(CLOUD_TS_KEY)||0);
    return ts?new Date(ts).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'尚未同步';
  }
  async function manualPull(){
    if(!isCloudOn()){
      if(!confirm('云同步尚未开启。是否现在开启并从云端恢复数据？'))return;
      localStorage.setItem('suishouji_cloud_on','1');
    }
    if(!initCloud()){toast('云端未就绪，请检查网络后重试');return;}
    if(!confirm('将从云端恢复数据并覆盖本机当前所有记录。\n本机未上传的改动会丢失，确定继续？'))return;
    syncing=true;updateCloudBadge('正在从云端拉取…');
    try{
      const {data,error}=await cloud.database.from(CLOUD_TABLE).select('*').eq('id','main').maybeSingle();
      if(error){cloudFailToast(error);updateCloudBadge('云端不可用');return;}
      if(data&&data.state&&Array.isArray(data.state.records)){
        const remoteTs=new Date(data.updated_at||0).getTime()||Date.now();
        state=normalizeState(data.state);
        localStorage.setItem(KEY,JSON.stringify(state));
        localStorage.setItem(CLOUD_TS_KEY,String(remoteTs));
        render();toast('已从云端恢复 '+state.records.length+' 笔记录');
      }else{toast('云端还没有数据，请先在另一端上传');}
    }catch(e){cloudFailToast(e);updateCloudBadge('云端不可用');}
    finally{syncing=false;}
  }
  // 云端失败统一提示：区分「资源隔离/未激活」与普通网络问题，并给出本地兜底
  function cloudFailToast(err){
    const msg=(err&&err.message)||'';
    if(/isolated|ISOLATED|未激活|isolat/i.test(msg)){
      toast('云端数据库未激活或已被隔离，云同步暂不可用。\n急用请走：我的 → 数据 → 导出/导入备份（JSON）在设备间迁移');
    }else{
      toast('云端连接失败，请检查网络后重试；或先用导出/导入备份迁移数据');
    }
  }
  async function manualPush(){
    if(!isCloudOn()){
      if(!confirm('云同步尚未开启。是否现在开启并把本机数据上传到云端？'))return;
      localStorage.setItem('suishouji_cloud_on','1');
    }
    if(!initCloud()){toast('云端未就绪，请检查网络后重试');return;}
    if(!confirm('将把本机当前所有记录上传并覆盖云端数据。\n其他设备未上传的改动会被覆盖，确定继续？'))return;
    await cloudPush();
    if(!syncing)toast('已上传到云端（'+state.records.length+' 笔记录）');
  }
  function schedulePush(){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudPush,1000);}
  async function cloudPull(silent){
    if(!cloudReady)return;
    try{
      const {data,error}=await cloud.database.from(CLOUD_TABLE).select('*').eq('id','main').maybeSingle();
      if(error){cloudFailToast(error);updateCloudBadge('云端不可用 · 可用导出/导入备份迁移');return;}
      if(data&&data.state&&Array.isArray(data.state.records)){
        const remoteTs=new Date(data.updated_at||0).getTime();
        const localTs=Number(localStorage.getItem(CLOUD_TS_KEY)||0);
        if(remoteTs>localTs){
          state=normalizeState(data.state);
          localStorage.setItem(KEY,JSON.stringify(state));
          localStorage.setItem(CLOUD_TS_KEY,String(remoteTs));
          if(!silent)toast('已从云端恢复数据');
          render();
        }
        updateCloudBadge('已同步 '+new Date(remoteTs).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}));
      }else{
        updateCloudBadge('云端待首次上传');
        if(!silent)schedulePush();
      }
    }catch(e){updateCloudBadge('云端读取失败');}
  }
  function updateCloudBadge(txt){
    const el=document.getElementById('cloudTip');
    if(el)el.textContent=txt+(isCloudOn()?' · 云端自动同步':' · 仅本机保存');
  }
  function toggleCloud(on){
    if(on){
      if(!initCloud()){toast('云端未就绪，请检查网络后重试');return;}
      localStorage.setItem('suishouji_cloud_on','1');
      render();toast('已开启云端同步，正在上传…');
      schedulePush();
    }else{
      localStorage.removeItem('suishouji_cloud_on');
      clearTimeout(cloudTimer);render();toast('云同步已关闭');
    }
  }

  // ---------- GitHub Gist 同步（免费，替代云端） ----------
  const GIST_TOKEN_KEY='jz_gist_token', GIST_ID_KEY='jz_gist_id';
  let gistTimer=null;
  function gistToken(){return localStorage.getItem(GIST_TOKEN_KEY)||'';}
  function gistId(){return localStorage.getItem(GIST_ID_KEY)||'';}
  function gistEnabled(){return !!gistToken();}
  function gistHeaders(){return {'Authorization':'Bearer '+gistToken(),'Content-Type':'application/json','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};}
  function gistSetStatus(t){const el=document.getElementById('gistTip');if(el)el.textContent=t;}
  async function gistPull(silent){
    if(!gistEnabled()){if(!silent)toast('请先填写 GitHub Token 并保存配置');return;}
    const id=gistId();if(!id){if(!silent)toast('还没有 Gist，请先上传到 Gist');return;}
    if(!silent&&!confirm('将从 Gist 恢复数据并覆盖本机当前所有记录。\n本机未上传的改动会丢失，确定继续？'))return;
    try{
      const r=await fetch('https://api.github.com/gists/'+id,{headers:gistHeaders()});
      if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||('HTTP '+r.status));}
      const data=await r.json();
      const content=data.files&&data.files['state.json']?data.files['state.json'].content:null;
      if(!content){if(!silent)toast('Gist 里还没有数据，请先在另一端上传');return;}
      const remote=JSON.parse(content);
      state=normalizeState(remote);
      localStorage.setItem(KEY,JSON.stringify(state));
      gistSetStatus('已恢复 '+state.records.length+' 笔 · '+new Date().toLocaleTimeString('zh-CN'));
      if(!silent)toast('已从 Gist 恢复 '+state.records.length+' 笔');
      render();
    }catch(e){
      gistSetStatus('Gist 拉取失败：'+(e.message||e));
      if(!silent)toast('Gist 拉取失败：'+(e.message||''));
    }
  }
  async function gistPush(){
    if(!gistEnabled())return;
    const payload=JSON.stringify(state);
    try{
      if(gistId()){
        const r=await fetch('https://api.github.com/gists/'+gistId(),{method:'PATCH',headers:gistHeaders(),body:JSON.stringify({files:{'state.json':{content:payload}}})});
        if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||('HTTP '+r.status));}
        gistSetStatus('已上传 '+state.records.length+' 笔 · '+new Date().toLocaleTimeString('zh-CN'));
      }else{
        const r=await fetch('https://api.github.com/gists',{method:'POST',headers:gistHeaders(),body:JSON.stringify({public:false,files:{'state.json':{content:payload}},description:'记账本同步数据（卢比工具集）'})});
        if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||('HTTP '+r.status));}
        const data=await r.json();
        localStorage.setItem(GIST_ID_KEY,data.id);
        const idEl=document.getElementById('gistId');if(idEl)idEl.value=data.id;
        gistSetStatus('已创建 Gist 并上传 '+state.records.length+' 笔');
        toast('已创建 Gist 并上传');
      }
    }catch(e){
      gistSetStatus('Gist 上传失败：'+(e.message||e));
      toast('Gist 上传失败：'+(e.message||''));
    }
  }
  function scheduleGistPush(){clearTimeout(gistTimer);gistTimer=setTimeout(()=>{gistPush();},1200);}
  function gistSaveCfg(){
    const tk=document.getElementById('gistToken').value.trim();
    const gid=document.getElementById('gistId').value.trim();
    localStorage.setItem(GIST_TOKEN_KEY,tk);
    localStorage.setItem(GIST_ID_KEY,gid);
    gistSetStatus(gistEnabled()?('已配置'+(gid?' · Gist:'+gid:' · 上传后生成')):'未配置');
    toast('已保存 Gist 配置');
    if(gistEnabled())gistPush();
  }

  // ---------- 记账 sheet ----------
  function openSheet(type,catId,editRec){
    if(editRec){
      sheet={open:true,type:editRec.type,amount:String(editRec.amount),catId:editRec.cat,date:editRec.date,account:editRec.account,note:editRec.note||'',editId:editRec.id};
    }else{
      sheet={open:true,type:type||'exp',amount:'',catId:catId||(state.cats[type||'exp'][0].id),date:todayStr(),account:'wechat',note:'',editId:null};
    }
    renderSheet();
    document.getElementById('mask').classList.add('show');
    document.getElementById('sheet').classList.add('show');
  }
  function closeSheet(){sheet.open=false;document.getElementById('mask').classList.remove('show');document.getElementById('sheet').classList.remove('show');}
  function renderSheet(){
    const sh=document.getElementById('sheet');
    const cats=state.cats[sheet.type];
    const amtHtml=sheet.amount?`<span class="cur">¥</span>${sheet.amount}`:`<span class="cur">¥</span>0`;
    const accOpts=state.accounts.map(a=>`<option value="${a.id}" ${sheet.account===a.id?'selected':''}>${a.icon} ${a.name}</option>`).join('');
    sh.innerHTML=`
      <div class="sh-top">
        <div class="seg">
          <button class="${sheet.type==='exp'?'on exp':''}" data-seg="exp">支出</button>
          <button class="${sheet.type==='inc'?'on inc':''}" data-seg="inc">收入</button>
        </div>
        <div class="close" id="sheetClose">×</div>
      </div>
      <div class="amt-box"><div class="a">${amtHtml}</div></div>
      <div class="cats">${cats.map(c=>`<div class="c ${sheet.catId===c.id?'on':''}" data-cat="${c.id}"><div class="ic">${c.icon}</div><div class="t">${esc(c.name)}</div></div>`).join('')}</div>
      <div class="meta-row">
        <div class="m">日期<input type="date" id="shDate" value="${sheet.date}"></div>
        <div class="m">账户<select id="shAcc">${accOpts}</select></div>
      </div>
      <div class="meta-row" style="padding-top:0">
        <div class="m">备注<input type="text" id="shNote" placeholder="写点什么…" value="${esc(sheet.note)}" maxlength="40"></div>
      </div>
      <div class="kp">
        ${['1','2','3','4','5','6','7','8','9','.',0,'del'].map(k=>{
          if(k==='del')return `<button class="del" data-k="del">⌫</button>`;
          if(k==='.')return `<button data-k=".">.</button>`;
          return `<button data-k="${k}">${k}</button>`;
        }).join('')}
      </div>
      <button class="save-btn" id="saveRec">${sheet.editId?'保存修改':'保存这笔'}</button>`;
    // 绑定
    sh.querySelectorAll('[data-seg]').forEach(el=>el.onclick=()=>{sheet.type=el.dataset.seg;sheet.catId=state.cats[sheet.type][0].id;renderSheet();});
    sh.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{sheet.catId=el.dataset.cat;renderSheet();});
    sh.querySelector('#sheetClose').onclick=closeSheet;
    sh.querySelector('#shDate').onchange=e=>sheet.date=e.target.value;
    sh.querySelector('#shAcc').onchange=e=>sheet.account=e.target.value;
    sh.querySelector('#shNote').oninput=e=>sheet.note=e.target.value;
    sh.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{
      const k=el.dataset.k;
      if(k==='del'){sheet.amount=sheet.amount.slice(0,-1);}
      else if(k==='.'){if(!sheet.amount.includes('.'))sheet.amount+='.';}
      else{sheet.amount+=k;}
      // 限制2位小数
      if(sheet.amount.includes('.')){const p=sheet.amount.split('.');if(p[1].length>2)sheet.amount=p[0]+'.'+p[1].slice(0,2);}
      if(sheet.amount.length>10)sheet.amount=sheet.amount.slice(0,10);
      renderSheet();
    });
    sh.querySelector('#saveRec').onclick=saveRecord;
  }
  function saveRecord(){
    const amt=parseFloat(sheet.amount);
    if(!amt||amt<=0){toast('请输入金额');return;}
    const c=catById(sheet.type,sheet.catId);
    if(sheet.editId){
      const rec=state.records.find(x=>x.id===sheet.editId);
      if(rec){
        rec.type=sheet.type;rec.amount=Math.round(amt*100)/100;rec.cat=sheet.catId;
        rec.account=sheet.account;rec.note=sheet.note.trim();rec.date=sheet.date;
      }
      save();closeSheet();render();
      toast('已修改：'+(c?c.name:'')+' ¥'+fmt(amt));
    }else{
      const rec={id:uid(),type:sheet.type,amount:Math.round(amt*100)/100,cat:sheet.catId,account:sheet.account,note:sheet.note.trim(),date:sheet.date,book:state.currentBook==='all'?'daily':state.currentBook,ts:Date.now()};
      state.records.push(rec);save();
      closeSheet();render();
      toast((sheet.type==='exp'?'支出':'收入')+'已记：'+(c?c.name:'')+' ¥'+fmt(amt));
    }
  }

  // ---------- 记录操作：修改 / 删除 ----------
  function openRecordAction(r){
    const c=catById(r.type,r.cat)||{name:'未分类',icon:'❓'};
    const sign=r.type==='exp'?'-':'+';
    const cls=r.type==='exp'?'exp':'inc';
    const sub=[r.date,(accById(r.account)||{}).name,r.note].filter(Boolean).join(' · ');
    const html=`<h3>这笔记录</h3>
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0 16px">
        <div style="width:42px;height:42px;border-radius:50%;background:#F3F4F7;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">${c.icon}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:15px;font-weight:600">${esc(c.name)}</div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sub)}</div>
        </div>
        <div style="font-size:18px;font-weight:800;color:${cls==='exp'?'var(--exp)':'var(--inc)'};white-space:nowrap">${sign}¥${fmt(r.amount)}</div>
      </div>
      <div class="row" style="gap:10px">
        <button class="ok" id="raEdit" style="flex:1">✏️ 修改</button>
        <button class="no" id="raDel" style="flex:1;background:#FCD5D5;color:#FF5B5B">🗑 删除</button>
      </div>
      <button class="no" id="raCancel" style="width:100%;margin-top:8px;padding:11px;border:none;border-radius:10px;background:#F0F1F4;color:var(--ink-2);font-size:14px;cursor:pointer;font-family:inherit">取消</button>`;
    showPop(html);
    document.getElementById('raEdit').onclick=()=>{hidePop();openSheet(r.type,null,r);};
    document.getElementById('raDel').onclick=()=>{
      if(confirm('确定删除这条记录？\n'+c.name+' '+sign+'¥'+fmt(r.amount))){
        state.records=state.records.filter(x=>x.id!==r.id);save();hidePop();render();toast('已删除');
      }
    };
    document.getElementById('raCancel').onclick=hidePop;
  }

  // ---------- 弹窗输入 ----------
  function showPop(html){const p=document.getElementById('pop');document.getElementById('popBox').innerHTML=html;p.classList.add('show');}
  function hidePop(){document.getElementById('pop').classList.remove('show');}
  function openInput(title,placeholder,value,cb,type){
    const html=`<h3>${esc(title)}</h3>
      <input type="${type||'text'}" id="popInput" placeholder="${esc(placeholder)}" value="${esc(value||'')}">
      <div class="row"><button class="no" id="popCancel">取消</button><button class="ok" id="popOk">确定</button></div>`;
    showPop(html);
    const inp=document.getElementById('popInput');
    setTimeout(()=>inp.focus(),50);
    document.getElementById('popCancel').onclick=hidePop;
    const ok=()=>{if(cb(inp.value))hidePop();};
    document.getElementById('popOk').onclick=ok;
    inp.onkeydown=e=>{if(e.key==='Enter')ok();};
  }

  // ---------- 导出 / 导入 ----------
  function exportData(){
    const data=JSON.stringify(state,null,2);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='记账本备份_'+todayStr()+'.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);toast('已导出');
  }
  function importData(){
    const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
    inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();
      rd.onload=()=>{try{const o=JSON.parse(rd.result);
        if(!o||!Array.isArray(o.records)){toast('文件格式不对');return;}
        state=normalizeState(o);save();render();toast('导入成功');
      }catch(e){toast('解析失败');}};
      rd.readAsText(f);};
    inp.click();
  }

  // ---------- 全局绑定 ----------
  function bindView(){
    document.getElementById('fab').onclick=()=>openSheet('exp');
    document.getElementById('mask').onclick=closeSheet;
    const fab=document.getElementById('fab');
    fab.style.display=(curTab==='wish')?'none':'';
  }

  // ---------- 启动 ----------
  state=load();
  render();
  if(isCloudOn()){
    if(initCloud()){cloudPull(true);setInterval(()=>{if(isCloudOn())cloudPull(true);},30000);}
    else{updateCloudBadge('云端未就绪');}
  }
})();
</script>
